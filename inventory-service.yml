datasource:
    url: jdbc:postgresql://localhost:9000/inventoryDB
    username: 
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  servlet:
    context-path: /inventory
  port: 9010

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
