

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:9000/orderDB
    username: postgres
    password: 123456789
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  config:
    import:
      configserver:http://localhost:8888

server:
  servlet:
    context-path: /orders
  port: 9020

resilience4j:
  retry:
    instances:
      inventoryRetry:
        maxRetryAttempts: 3
        waitDuration: 5s
  rate limiter:
    configs:
      default:
        limitForPeriod: 1
        limitRefreshPeriod: 5s
        timeOutDuration: 1s
  circuit breaker:
    instances:
      inventoryCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 10
        eventConsumerBufferSize: 10
management:
  health:
    circuit breakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

